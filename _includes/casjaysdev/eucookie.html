<link rel="stylesheet" type="text/css"
  href="https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.0.3/cookieconsent.min.css" />
<style>
  .cc-window.cc-banner,
  .cc-window.cc-floating {
    width: 100%;
    max-width: 100%;
    left: 0;
    right: 0;
    box-sizing: border-box;
  }
  @media screen and (min-width: 25.9375em) {
    .cc-window.cc-floating {
      bottom: 0;
      flex-direction: row;
      align-items: center;
    }
    .cc-window.cc-floating:not(.cc-theme-edgeless) {
      padding: 1em 1.8em;
    }
    .cc-window.cc-floating .cc-message {
      flex: 1;
      margin-bottom: 0;
    }
    .cc-window.cc-floating .cc-compliance {
      flex: 0 0 auto;
    }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.0.3/cookieconsent.min.js"></script>
<script>
  window.addEventListener("load", function () {
    window.cookieconsent.initialise({
      "palette": {
        "popup": {
          "background": "#64386b",
          "text": "#ffcdfd"
        },
        "button": {
          "background": "transparent",
          "text": "#f8a8ff",
          "border": "#f8a8ff"
        }
      },
      "content": {
        "message": "In accordance with the EU GDPR law this message is being displayed. - ",
        "dismiss": "I Agree",
        "link": "CasjaysDev Policy",
        "href": "https://casjaysdev.pro/policy/"
      },
      "type": "opt-out"
    })
  });
</script>
<br />
